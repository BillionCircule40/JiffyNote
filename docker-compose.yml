services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jiffynote_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jiffynote_db}
      POSTGRES_USER: ${JIFFYNOTE_POSTGRES_USER:-${POSTGRES_USER:-jiffynote_user}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/003_complete_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/seed/001_sample_data.sql:/docker-entrypoint-initdb.d/002_sample_data.sql:ro
      - ./database/migrations/004_planner_data.sql:/docker-entrypoint-initdb.d/003_planner_data.sql:ro
      - ./database/migrations/005_event_priority_recurrence.sql:/docker-entrypoint-initdb.d/004_event_priority_recurrence.sql:ro
      - ./database/migrations/006_planner_tables.sql:/docker-entrypoint-initdb.d/005_planner_tables.sql:ro
      - ./database/migrations/007_case_insensitive_account_uniqueness.sql:/docker-entrypoint-initdb.d/006_case_insensitive_account_uniqueness.sql:ro
      - ./database/migrations/008_plan_event_note_ids.sql:/docker-entrypoint-initdb.d/007_plan_event_note_ids.sql:ro
      - ./database/migrations/009_plan_event_multiple_days.sql:/docker-entrypoint-initdb.d/008_plan_event_multiple_days.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - jiffynote_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Node.js API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jiffynote_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-jiffynote_db}
      DB_USER: ${JIFFYNOTE_POSTGRES_USER:-${POSTGRES_USER:-jiffynote_user}}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-before-deploying}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jiffynote_network

  # React Application (Nginx)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jiffynote_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - server
    networks:
      - jiffynote_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  jiffynote_network:
    driver: bridge
