services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jiffynote_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jiffynote_db}
      POSTGRES_USER: ${POSTGRES_USER:-jiffynote_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
      - ./database/seed:/docker-entrypoint-seed
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - jiffynote_network

  # React Application (Nginx)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jiffynote_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8080/api}
      - REACT_APP_DB_HOST=${REACT_APP_DB_HOST:-postgres}
      - REACT_APP_DB_PORT=${REACT_APP_DB_PORT:-5432}
      - REACT_APP_DB_NAME=${REACT_APP_DB_NAME:-jiffynote_db}
      - REACT_APP_DB_USER=${REACT_APP_DB_USER:-jiffynote_user}
      - REACT_APP_DB_PASSWORD=${REACT_APP_DB_PASSWORD:-secure_password}
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - postgres
    networks:
      - jiffynote_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  jiffynote_network:
    driver: bridge
